      const year = d.getFullYear();
      const wk = Math.ceil((((d - new Date(year,0,1)) / 86400000) + 1)/7);
      return `limpieza_hogar_${year}W${wk}`;

                    <div key={persona} className="bg-white rounded-2xl p-4 card-shadow flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${m?.color || 'from-stone-400 to-stone-600'} flex items-center justify-center text-xl shadow-md`}>
                        {m?.emoji || '👤'}
                      </div>
                      <div className="flex-1">
                        <p className="font-display text-lg font-bold text-stone-900">{persona}</p>
                        <p className="text-xs text-stone-500">Esta semana lava:</p>
                      </div>
                      <p className="text-sm font-semibold text-purple-700 text-right">{asign}</p>
                    </div>
                  );
                })}
              </div>

              <div className="mt-5 bg-blue-50 border border-blue-200 rounded-2xl p-4">
                <p className="text-sm text-blue-900 mb-2"><strong>🛁 Baño Papá/Mamá esta semana:</strong></p>
                <p className="text-sm text-blue-800">Le toca a <strong>{rotMCS[semanaRopa]}</strong> (mantenimiento mar/jue + limpieza profunda sábado).</p>
              </div>

              <div className="mt-3 bg-purple-50 border border-purple-200 rounded-2xl p-4">
                <p className="text-sm text-purple-900 mb-2"><strong>📌 Cómo funciona</strong></p>
                <ul className="text-xs text-purple-900 space-y-1">
                  <li>• Día de lavado: <strong>sábado 9:30am</strong> (Camila al volver de prepa 14:00).</li>
                  <li>• Día de doblar y guardar: <strong>sábado 19:00</strong>.</li>
                  <li>• Si tu ropa no está en el cesto el viernes en la noche, no se lava.</li>
                  <li>• Cada lunes, Papá actualiza la semana (A → B → C → A).</li>
                </ul>
              </div>
            </main>
          )}

          {vista === 'puntaje' && (
            <main className="max-w-5xl mx-auto px-5 py-5">
              <div className="flex items-end justify-between mb-4">
                <h2 className="font-display text-3xl font-bold gradient-text">Liga familiar</h2>
                <div className="text-right">
                  <p className="text-xs uppercase tracking-wider text-stone-500 font-semibold">Familia</p>
                  <p className="font-display text-3xl font-bold text-stone-900">{cumplimientoFamiliar}%</p>
                </div>
              </div>

              <div className="bg-slate-900 text-white rounded-2xl p-4 mb-3 card-shadow">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-slate-700 to-slate-900 flex items-center justify-center text-xl shadow-md ring-2 ring-amber-400">👔</div>
                  <div className="flex-1">
                    <div className="flex items-center gap-2">
                      <span className="font-display text-lg font-bold">Papá</span>
                      <span className="text-[10px] uppercase tracking-wider font-bold px-2 py-0.5 rounded-full bg-amber-400 text-slate-900">Supervisor</span>
                    </div>
                    <p className="text-xs text-slate-300">Métrica: cumplimiento global familiar ↑</p>
                  </div>
                </div>
              </div>

              <div className="bg-rose-50 border border-rose-200 rounded-2xl p-4 mb-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-500 to-pink-600 flex items-center justify-center text-xl shadow-md">👩‍🍳</div>
                  <div className="flex-1">
                    <div className="flex items-center gap-2">
                      <span className="font-display text-lg font-bold text-rose-900">Mamá</span>
                      <span className="text-[10px] uppercase tracking-wider font-bold px-2 py-0.5 rounded-full bg-rose-200 text-rose-900">Chef</span>
                    </div>
                    <p className="text-xs text-rose-800">Métrica: comidas servidas + traslados cubiertos</p>
                  </div>
                </div>
              </div>

              <div className="space-y-3">
                {[...puntajePorPersona].sort((a,b) => b.pct - a.pct).map((p, idx) => (
                  <div key={p.id} className="bg-white rounded-2xl p-4 card-shadow">
                    <div className="flex items-center gap-3 mb-2">
                      <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${p.color} flex items-center justify-center text-xl shadow-md`}>{p.emoji}</div>
                      <div className="flex-1">
                        <div className="flex items-center gap-2">
                          <span className="font-display text-lg font-bold">{p.nombre}</span>
                          {idx === 0 && <span className="text-amber-500">🏆</span>}
                        </div>
                        <p className="text-xs text-stone-500">{p.hechas} de {p.total} tareas · {p.ptsHechos}/{p.ptsTotal} pts</p>
                      </div>
                      <span className="font-display text-2xl font-bold text-stone-900">{p.pct}%</span>
                    </div>
                    <div className="h-2 bg-stone-100 rounded-full overflow-hidden">
                      <div className={`h-full bg-gradient-to-r ${p.color} transition-all duration-500`} style={{ width: `${p.pct}%` }} />
                    </div>
                  </div>
                ))}
              </div>

              <div className="mt-5 bg-stone-900 text-stone-100 rounded-2xl p-4">
                <p className="text-xs uppercase tracking-wider font-bold text-amber-400 mb-2">🏆 Reglas de la liga</p>
                <ul className="text-sm space-y-1 text-stone-300">
                  <li>• 90%+ semanal individual → privilegio (peli, postre, salida)</li>
                  <li>• Top del mes → 1 día de pase libre</li>
                  <li>• 90%+ familiar → salida especial el finde</li>
                </ul>
              </div>
            </main>
          )}

          <footer className="max-w-5xl mx-auto px-5 py-8 text-center text-xs text-stone-400">
            Limpieza del Hogar · Tus marcas se guardan en este dispositivo
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
